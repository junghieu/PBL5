<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Service - Chuyển đổi ảnh sang Word</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .upload-area {
            border: 3px dashed #dee2e6;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #e7f3ff;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 1.1rem;
            padding: 8px 16px;
        }
        .result-card {
            margin-top: 20px;
            display: none;
        }
        .text-content {
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .spinner-border-custom {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-white fw-bold">
                <i class="bi bi-file-earmark-text"></i> OCR Service
            </h1>
            <p class="text-white">Chuyển đổi ảnh thành tài liệu Word</p>
        </div>

        <!-- Upload Card -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">
                    <i class="bi bi-cloud-upload"></i> Tải ảnh lên
                </h5>
                
                <div class="upload-area" id="uploadArea">
                    <i class="bi bi-camera text-muted" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Chụp ảnh hoặc chọn file</h5>
                    <p class="text-muted">Hỗ trợ: JPG, PNG, JPEG</p>
                    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
                    <div class="btn-group mt-3" role="group">
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('fileInput').click();">
                            <i class="bi bi-folder2-open"></i> Chọn file
                        </button>
                        <button type="button" class="btn btn-success" onclick="openCamera();">
                            <i class="bi bi-camera"></i> Chụp ảnh
                        </button>
                    </div>
                </div>
                
                <div id="previewContainer" style="display: none;">
                    <img id="previewImage" class="preview-image" alt="Preview">
                    <div class="text-center mt-3">
                        <button class="btn btn-primary btn-lg" id="uploadBtn" onclick="uploadImage()">
                            <i class="bi bi-upload"></i> Tải lên và xử lý
                        </button>
                        <button class="btn btn-secondary btn-lg" onclick="resetUpload()">
                            <i class="bi bi-x-circle"></i> Hủy
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Card -->
        <div class="card result-card" id="statusCard">
            <div class="card-body">
                <h5 class="card-title mb-3">
                    <i class="bi bi-info-circle"></i> Trạng thái xử lý
                </h5>
                
                <div class="text-center" id="statusContent">
                    <div class="spinner-border spinner-border-custom text-primary" role="status" id="loadingSpinner">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">
                        <span class="status-badge badge bg-warning" id="statusBadge">Đang xử lý...</span>
                    </p>
                    <p class="text-muted" id="statusMessage">Vui lòng đợi trong giây lát</p>
                </div>
                
                <div id="resultContent" style="display: none;">
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle"></i> Xử lý hoàn tất!
                    </div>
                    
                    <h6 class="mt-3">Nội dung văn bản:</h6>
                    <div class="text-content" id="textContent"></div>
                    
                    <div class="text-center mt-3">
                        <button class="btn btn-success btn-lg" onclick="downloadDocx()">
                            <i class="bi bi-download"></i> Tải xuống file Word
                        </button>
                        <button class="btn btn-primary btn-lg" onclick="resetAll()">
                            <i class="bi bi-arrow-clockwise"></i> Xử lý ảnh mới
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentScanId = null;
        let pollingInterval = null;
        let selectedFile = null;

        // File input change handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                previewFile(file);
            }
        });

        function openCamera() {
            const input = document.getElementById('fileInput');
            input.setAttribute('capture', 'environment');
            input.click();
        }

        function previewFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('uploadArea').style.display = 'none';
                document.getElementById('previewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('fileInput').value = '';
            selectedFile = null;
        }

        async function uploadImage() {
            if (!selectedFile) {
                alert('Vui lòng chọn một ảnh');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);

            document.getElementById('uploadBtn').disabled = true;
            document.getElementById('uploadBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang tải...';

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Upload failed');
                }

                const data = await response.json();
                currentScanId = data.scan_id;

                // Show status card
                document.getElementById('statusCard').style.display = 'block';
                document.getElementById('statusContent').style.display = 'block';
                document.getElementById('resultContent').style.display = 'none';

                // Start polling
                startPolling();

                // Scroll to status card
                document.getElementById('statusCard').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('Lỗi: ' + error.message);
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('uploadBtn').innerHTML = '<i class="bi bi-upload"></i> Tải lên và xử lý';
            }
        }

        function startPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }

            pollingInterval = setInterval(checkStatus, 2000);
            checkStatus(); // Check immediately
        }

        async function checkStatus() {
            if (!currentScanId) return;

            try {
                const response = await fetch(`/status/${currentScanId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to check status');
                }

                const data = await response.json();
                
                document.getElementById('statusMessage').textContent = `ID: ${data.id} - ${data.status}`;

                if (data.status === 'Completed') {
                    // Stop polling
                    clearInterval(pollingInterval);
                    
                    // Hide loading, show result
                    document.getElementById('statusContent').style.display = 'none';
                    document.getElementById('resultContent').style.display = 'block';
                    document.getElementById('textContent').textContent = data.text_content || 'Không có nội dung';
                    
                } else if (data.status.startsWith('Failed')) {
                    // Stop polling on error
                    clearInterval(pollingInterval);
                    document.getElementById('statusBadge').className = 'status-badge badge bg-danger';
                    document.getElementById('statusBadge').textContent = 'Lỗi';
                    document.getElementById('statusMessage').textContent = data.status;
                    document.getElementById('loadingSpinner').style.display = 'none';
                }

            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function downloadDocx() {
            if (currentScanId) {
                window.location.href = `/download/${currentScanId}`;
            }
        }

        function resetAll() {
            clearInterval(pollingInterval);
            currentScanId = null;
            selectedFile = null;
            
            document.getElementById('statusCard').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('uploadBtn').innerHTML = '<i class="bi bi-upload"></i> Tải lên và xử lý';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('statusBadge').className = 'status-badge badge bg-warning';
            document.getElementById('statusBadge').textContent = 'Đang xử lý...';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
